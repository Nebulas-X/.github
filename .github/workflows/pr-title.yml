# pr-title: the pull request's title is a Conventional Commit (Conventional Commits 1.0; ADR-0019). Squash merges
# make the title the commit subject on the default branch. Called by every repository's CI, pinned by commit SHA.
# No secret: the title comes from the caller's event payload, passed through the environment, never interpolated
# into the script.
name: pr-title

on:
  workflow_call:
    inputs:
      types:
        description: The allowed commit types, separated by spaces.
        type: string
        default: build chore ci docs feat fix perf refactor revert style test
      max-length:
        description: The longest title accepted, in characters.
        type: number
        default: 100

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that the title is a Conventional Commit
        id: check-pr-title
        shell: node {0}
        env:
          NBX_EVENT_NAME: ${{ github.event_name }}
          NBX_PR_TITLE: ${{ github.event.pull_request.title }}
          NBX_TYPES: ${{ inputs.types }}
          NBX_MAX_LENGTH: ${{ inputs.max-length }}
        run: |
          'use strict';
          const event = process.env.NBX_EVENT_NAME ?? '';
          if (!event.startsWith('pull_request')) {
            console.log(`Not a pull request (event «${event}»): pr-title checks pull requests only.`);
            process.exit(0);
          }
          const title = process.env.NBX_PR_TITLE ?? '';
          const types = (process.env.NBX_TYPES ?? '').split(/\s+/).filter(Boolean);
          const maxLength = Number(process.env.NBX_MAX_LENGTH ?? '100');
          const pattern = new RegExp(`^(?:${types.join('|')})(?:\\([a-z0-9]+(?:-[a-z0-9]+)*\\))?!?: \\S(?:.*\\S)?$`, 'u');
          const problems = [];
          if (!pattern.test(title)) {
            problems.push(`it must read «<type>(<scope>)?!?: <description>», with a type from: ${types.join(', ')}; the scope is lowercase kebab-case`);
          }
          if ([...title].length > maxLength) problems.push(`it is longer than ${maxLength} characters`);
          if (/[\r\n]/u.test(title)) problems.push('it holds a line break');
          if (problems.length > 0) {
            console.log(`::error title=pr-title::The title «${title}» is not a Conventional Commit: ${problems.join('; ')}.`);
            process.exit(1);
          }
          console.log(`The title «${title}» is a Conventional Commit.`);
