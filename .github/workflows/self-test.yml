# self-test: this repository's own CI. It runs the reusable workflows' tests (each check on a must-pass and a
# must-fail fixture, ADR-0032) and calls the reusable workflows on this repository through local references, so a
# change is proven before any caller pins its commit. No secret; GitHub-hosted runners only (ADR-0017).
name: self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Install pnpm
        shell: bash
        env:
          NBX_PNPM_SHA256: 3726060e236c0db3e7124c0a5af123c840ba0cb76682149b63ea0baf290017c2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pnpm.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://github.com/pnpm/pnpm/releases/download/v12.18.0/pnpm-linux-x64.tar.gz
          echo "$NBX_PNPM_SHA256  $archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/pnpm"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pnpm"
          echo "NBX_PNPM=$RUNNER_TEMP/pnpm/pnpm" >> "$GITHUB_ENV"

      - name: Run the checks' tests
        shell: bash
        run: node --test --test-timeout=15000 '.github/workflows/tests/*.test.mjs'

  pr-title:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/pr-title.yml
    permissions: {}

  hygiene:
    uses: $/.github/workflows/repository-hygiene.yml
    permissions:
      contents: read
    with:
      require-dependabot: false

  workflows:
    uses: $/.github/workflows/workflow-security.yml
    permissions:
      contents: read
    with:
      forbid-self-hosted: true
